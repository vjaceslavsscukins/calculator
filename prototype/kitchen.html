<title>Конструктор кухонь</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 3D is the hero. Left: project menu (Помещение / Каталог / Модуль / Материалы). Right: 3D stage with a bottom drawer for the estimate. Below 1080px everything stacks. */
:root{
  --bg:#F1EFEA; --surface:#FFFFFF; --sunk:#EAE7E0; --input:#FAF9F6;
  --ink:#1C1B19; --muted:#6A665E; --line:#DCD8CF;
  --accent:#A9532A; --accent-ink:#FFFFFF; --accent-soft:#F6E6DB;
  --pri:#1C1B19; --pri-ink:#FFFFFF;
  --warn:#B23E0C; --warn-soft:#FBE8DD; --ok:#2E7649;
  --stage-a:#F8F6F2; --stage-b:#E2DED5; --glass:rgba(255,255,255,.84);
  --shadow:0 1px 2px rgba(28,27,25,.06),0 10px 30px rgba(28,27,25,.08);
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141311; --surface:#1D1C19; --sunk:#26241F; --input:#181714;
  --ink:#ECE8E1; --muted:#A19C92; --line:#34322C;
  --accent:#E58B5A; --accent-ink:#1B0F08; --accent-soft:#3A2519;
  --pri:#ECE8E1; --pri-ink:#1A1816;
  --warn:#FF9A62; --warn-soft:#3A2418; --ok:#6FCB91;
  --stage-a:#2B2926; --stage-b:#191816; --glass:rgba(29,28,25,.84);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1D1C19; --sunk:#26241F; --input:#181714;
  --ink:#ECE8E1; --muted:#A19C92; --line:#34322C;
  --accent:#E58B5A; --accent-ink:#1B0F08; --accent-soft:#3A2519;
  --pri:#ECE8E1; --pri-ink:#1A1816;
  --warn:#FF9A62; --warn-soft:#3A2418; --ok:#6FCB91;
  --stage-a:#2B2926; --stage-b:#191816; --glass:rgba(29,28,25,.84);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}

.top{flex:none;height:64px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.mark{width:36px;height:36px;border-radius:10px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;flex:none}
.brand-name{font-weight:600;font-size:16px;letter-spacing:-.01em;line-height:1.2}
.brand-sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-flag{font-size:12px;background:var(--warn-soft);color:var(--warn);padding:4px 10px;border-radius:999px;font-weight:500;white-space:nowrap}
.hdr-total{text-align:right;flex:none}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.hdr-total .num{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.hdr-split{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

.work{flex:1;min-height:0;display:grid;grid-template-columns:372px minmax(0,1fr);gap:12px;padding:0 12px 12px}
.stagecol{position:relative;min-height:0;min-width:0}
.stage-wrap{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:radial-gradient(120% 95% at 50% 25%,var(--stage-a),var(--stage-b));border:1px solid var(--line);box-shadow:var(--shadow)}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage-tools{position:absolute;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.gbtn{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.gbtn:hover{border-color:var(--muted)}
.gbtn[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.stage-hint{position:absolute;left:16px;bottom:78px;right:16px;font-size:12px;color:var(--muted);pointer-events:none}
.stage-err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.place-banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--pri);color:var(--pri-ink);padding:8px 8px 8px 14px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:var(--shadow);z-index:4;max-width:calc(100% - 330px)}
.place-banner button{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:999px;padding:4px 10px;font-size:12px}
.place-banner[hidden]{display:none}

.side{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.ltabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px;background:var(--sunk);border-bottom:1px solid var(--line)}
.ltab{border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:13px;font-weight:500;color:var(--muted)}
.ltab:hover{color:var(--ink)}
.ltab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lbody{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin;min-height:0;flex:1}
.sec{display:flex;flex-direction:column;gap:10px}
.sec+.sec{padding-top:16px;border-top:1px solid var(--line)}
.sec h3{margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-size:12.5px;color:var(--muted)}
input[type=number],input[type=text],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--input);min-width:0}
input[type=number]{font-family:var(--f-mono);font-size:13px}
input[type=color]{width:36px;height:30px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--input)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--sunk);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.16);padding:0;background-size:cover}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.sw.none{background:var(--surface);font-size:11px;color:var(--muted);width:auto;border-radius:15px;padding:0 10px;border:1px dashed var(--muted)}
.swname{font-size:12.5px;color:var(--ink);font-weight:500}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.chk input{width:16px;height:16px;accent-color:var(--accent);flex:none}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.plan button{border:1px solid var(--line);background:var(--input);border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.plan button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.plan svg{width:44px;height:30px}

.fill{display:flex;flex-direction:column;gap:7px}
.fillrow{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center;font-size:12px}
.fillrow .t{color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.over i{background:var(--warn)}
.fillnote{grid-column:2;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:-3px}
.fillnote.over{color:var(--warn)}
.warn{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 10px}

.cats{display:flex;flex-wrap:wrap;gap:5px}
.cat{border:1px solid var(--line);background:var(--input);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500}
.cat[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;transition:transform .12s,box-shadow .12s,border-color .12s}
.card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(28,27,25,.1);transform:translateY(-1px)}
.card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.card svg{width:100%;height:64px;pointer-events:none}
.card .cn{font-size:11.5px;line-height:1.25;font-weight:500;pointer-events:none}
.card .cs{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);pointer-events:none}
.dnd-note{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:8px 10px}
.dragchip{position:fixed;z-index:50;pointer-events:none;background:var(--pri);color:var(--pri-ink);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow);transform:translate(-50%,-140%);white-space:nowrap}

.mgroup{display:flex;flex-direction:column;gap:2px}
.mgroup h4{margin:4px 0 2px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mitem{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:6px 8px;width:100%}
.mitem:hover{background:var(--sunk)}
.mitem[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.mitem .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.mitem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.mitem .nm small{font-family:var(--f-mono);color:var(--muted);font-size:11.5px;margin-left:4px}
.mitem .pr{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.pri:hover{filter:brightness(1.2)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:5px 9px;font-size:12px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--input);border-radius:8px;padding:3px 8px;font-family:var(--f-mono);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.edhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.edhead .ttl{font-weight:600;font-size:15px}
.edhead .pr{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{width:100%;border-collapse:collapse;font-size:12px}
.mini td{padding:4px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.mini td:last-child{text-align:right;font-family:var(--f-mono);white-space:nowrap;padding-left:8px}
.mini td.sz{font-family:var(--f-mono);white-space:nowrap;color:var(--muted);padding-left:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}

/* estimate drawer over the stage */
.docs{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(16px) saturate(1.15);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);max-height:calc(100% - 24px)}
.docs[data-open="true"]{background:var(--surface)}
.dockbar{display:flex;align-items:center;gap:10px;padding-right:10px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;padding-left:8px}
.tab{padding:14px 12px 12px;border:0;background:none;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
.tab:hover{color:var(--ink)}
.docs[data-open="true"] .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.dockinfo{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.dockinfo b{font-size:16px;font-variant-numeric:tabular-nums;font-weight:600}
.dockbtn{display:inline-flex;align-items:center;gap:6px}
.dockbtn svg{transition:transform .2s}
.docs[data-open="true"] .dockbtn svg{transform:rotate(180deg)}
.docbody{display:none;overflow:auto;padding:0 20px 20px;min-height:0;border-top:1px solid var(--line)}
.docs[data-open="true"] .docbody{display:block;max-height:min(56vh,640px)}
.dochead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;padding:16px 0 12px}
.dochead h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.dochead .meta{color:var(--muted);font-size:13px;max-width:90ch}
.doctools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.disc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.disc input{width:70px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:12.5px}
.t th,.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.t th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--sunk)}
.t tr:last-child td{border-bottom:0}
.t .num{text-align:right}
.t .sz{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.t .sub{display:block;font-size:11.5px;color:var(--muted)}
.t .grp td{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding-top:12px}
.t .strong{font-weight:600}
.t tr.sel td{background:var(--accent-soft)}
.t tbody tr[data-id]{cursor:pointer}
.t tbody tr[data-id]:hover td{background:var(--sunk)}
.t tbody tr.sel[data-id]:hover td{background:var(--accent-soft)}
.t input{padding:4px 6px;font-size:12.5px}
.t input[type=number]{width:96px;text-align:right}
.t input[type=text]{min-width:190px}
.t select{width:auto;padding:4px 6px;font-size:12.5px}
.t.smeta td:nth-child(2){white-space:normal;min-width:210px}
.t.smeta th:last-child,.t.smeta td:last-child{position:sticky;right:0;background:var(--surface);box-shadow:-8px 0 8px -8px rgba(0,0,0,.14)}
.t.smeta th:last-child{background:var(--sunk)}
.t.smeta tr.sel td:last-child{background:var(--accent-soft)}
.t.smeta tr.grp td:last-child{position:static;box-shadow:none;background:transparent}
.extras{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.extras h3{margin:0;font-size:14px;font-weight:600}
.extras .t input[type=number]{width:84px}
.extras .t input[type=text]{min-width:230px}
.extras .t td:last-child{width:1%}
.sums{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;max-width:460px;margin:18px 0 0 auto;font-variant-numeric:tabular-nums}
.sums dt{color:var(--muted)}
.sums dd{margin:0;text-align:right}
.sums .total{font-weight:600;font-size:22px;letter-spacing:-.01em;color:var(--ink);padding-top:8px;border-top:1px solid var(--line)}
.sums .cost{font-size:12.5px}
.note{font-size:12.5px;color:var(--muted);margin:14px 0 0;max-width:80ch}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pgroup{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px}
.pgroup h4{margin:0 0 3px;font-size:12px;font-weight:600}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 96px 62px;gap:8px;align-items:center;font-size:13px}
.prow .u{font-size:11.5px;color:var(--muted)}
.prow input{padding:5px 7px;text-align:right}
.catblock{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.catblock h3{margin:0;font-size:14px;font-weight:600}
details.paste summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:500}
details.paste[open]{background:var(--sunk);border-radius:12px;padding:10px}
details.paste textarea{min-height:90px;font-family:var(--f-mono);font-size:12px;margin:8px 0}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pri);color:var(--pri-ink);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow)}
.copybox{width:100%;min-height:160px;margin-top:10px;font-family:var(--f-mono);font-size:12px}

@media (max-width: 1080px){
  .app{height:auto;min-height:100vh}
  .top{height:auto;padding-block:12px;flex-wrap:wrap}
  .work{display:flex;flex-direction:column;flex:none}
  .stagecol{display:contents}
  .stage-wrap{position:relative;inset:auto;order:1;height:clamp(340px,56vh,560px)}
  .side{order:2}
  .lbody{overflow:visible}
  .docs{position:static;order:3;max-height:none;background:var(--surface)}
  .docs .docbody{display:block;max-height:none}
  .docs .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .dockbtn,.dockinfo{display:none}
  .stage-hint{bottom:12px}
  .place-banner{max-width:calc(100% - 24px);top:56px}
}
@media (max-width: 560px){
  .hdr-total{text-align:left}
  .top-flag{display:none}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row3{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* commercial proposal (КП): hidden on screen, the only thing printed */
#printArea{display:none}
@page{size:A4;margin:14mm}
@media print{
  html,body{background:#fff!important}
  .app,.toast,.dragchip{display:none!important}
  #printArea{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.kp{color:#1C1B19;font-family:var(--f-body);font-size:11pt;line-height:1.4}
.kp-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1C1B19;padding-bottom:10px}
.kp-brand{font-size:20pt;font-weight:600;letter-spacing:-.01em}
.kp-title{font-size:10pt;color:#6A665E;text-transform:uppercase;letter-spacing:.1em}
.kp-meta{text-align:right;font-size:10pt;color:#4a463f}
.kp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-top:6mm}
.kp-img{width:100%;max-height:105mm;object-fit:cover;object-position:50% 60%;border-radius:6px;border:1px solid #DCD8CF;display:block}
.kp h2{font-size:10pt;text-transform:uppercase;letter-spacing:.1em;color:#6A665E;margin:6mm 0 2mm;font-weight:600}
.kp-spec{margin:0;display:grid;grid-template-columns:auto 1fr;gap:1.5mm 4mm;font-size:10pt}

const TYPES = {

  upper_glass:      {name:'Витрина со стеклом',    cat:'up',   row:'up',   w:600,  h:720,  d:300, widths:[400,450,500,600,800]},
  upper_lift:       {name:'С подъёмником',         cat:'up',   row:'up',   w:600,  h:360,  d:300, widths:[500,600,800,900]},

  upper_corner:     {name:'Угловой верхний',       cat:'up',   row:'up',   w:620,  h:720,  d:300, widths:[620,650,700]},
  mezz_door:        {name:'Антресоль с дверцами',  cat:'mezz', row:'mezz', w:600,  h:360,  d:300, widths:[400,600,800,900]},
  mezz_lift:        {name:'Антресоль с подъёмником', cat:'mezz', row:'mezz', w:600, h:360,  d:300, widths:[600,800,900]},
  tall_door:        {name:'Пенал с дверцами',      cat:'tall', row:'low',  w:600,  h:2070, d:560, widths:[400,450,500,600], tall:true},
  tall_oven:        {name:'Под духовку и СВЧ',     cat:'tall', row:'low',  w:600,  h:2070, d:560, widths:[600], tall:true},
  tall_fridge:      {name:'Под встроенный холодильник', cat:'tall', row:'low', w:600, h:2070, d:560, widths:[600], tall:true},
  gap_low:          {name:'Проём внизу',           cat:'gap',  row:'low',  w:600,  h:0, d:0, widths:[600,700,900], gap:true},
  gap_up:           {name:'Проём вверху',          cat:'gap',  row:'up',   w:600,  h:0, d:0, widths:[400,600,800], gap:true},
  gap_mezz:         {name:'Проём на антресолях',   cat:'gap',  row:'mezz', w:600,  h:0, d:0, widths:[600,800,1200], gap:true},
};
const CATS = [['low','Нижние'],['up','Верхние'],['mezz','Антресоли'],['tall','Пеналы'],['gap','Проёмы']];
const ROWS = [['low','нижний ряд и пеналы'],['up','верхний ряд'],['mezz','антресоли']];

const DRAWERS = {
  legrabox:{n:'LEGRABOX', colors:[{id:'orion',name:'Орион серый',hex:'#8B9095'},{id:'silk',name:'Шёлковый белый',hex:'#E9E8E3'},{id:'carbon',name:'Карбон чёрный',hex:'#2A2A2B'},{id:'steel',name:'Нерж. сталь',hex:'#B9BCBE',metal:true}]},
  tandembox:{n:'TANDEMBOX', colors:[{id:'silk',name:'Шёлковый белый',hex:'#E9E8E3'},{id:'grey',name:'Серый',hex:'#9A9C9E'},{id:'terra',name:'Терра чёрный',hex:'#333230'}]},
};
const HANDLES = {bar:'Ручка-скоба', gola:'Профиль Gola', push:'Push, TIP-ON'};

const DEFAULT_CAT = {
  corpus:[
    {id:'c1', name:'Белый', hex:'#EDEDE8', pattern:'plain', price:1100},
    {id:'c2', name:'Серый камень', hex:'#A3A6A1', pattern:'plain', price:1150},
    {id:'c3', name:'Графит', hex:'#3D4042', pattern:'plain', price:1150},
    {id:'c4', name:'Дуб Сонома', hex:'#C9A57A', pattern:'wood', price:1200}],
  facade:[
    {id:'f1', name:'МДФ плёнка ПВХ', finish:'satin', price:6500},
    {id:'f2', name:'МДФ эмаль матовая', finish:'matte', price:11000},
    {id:'f3', name:'МДФ эмаль глянец', finish:'gloss', price:13500},
    {id:'f4', name:'Пластик AGT', finish:'satin', price:9000},
    {id:'f5', name:'ЛДСП 16 мм', finish:'matte', price:2600}],
  milling:[
    {id:'n0', name:'Без фрезеровки', style:'flat', add:0},
    {id:'n1', name:'Рамка «Шейкер»', style:'frame', add:1800},
    {id:'n2', name:'Классика', style:'classic', add:3200},
    {id:'n3', name:'Вертикальные пазы', style:'grooves', add:1500}],
  fcolor:[
    {id:'k1', name:'Белый', hex:'#F1F0EA', pattern:'plain'}, {id:'k2', name:'Кашемир', hex:'#C9BCAE', pattern:'plain'},
    {id:'k3', name:'Песочный', hex:'#D6C3A2', pattern:'plain'}, {id:'k4', name:'Шалфей', hex:'#9EAC95', pattern:'plain'},
    {id:'k5', name:'Оливковый', hex:'#6F7356', pattern:'plain'}, {id:'k6', name:'Тёмно-синий', hex:'#2C3B57', pattern:'plain'},
    {id:'k7', name:'Графит', hex:'#3A3E41', pattern:'plain'}, {id:'k8', name:'Дуб натуральный', hex:'#B98A57', pattern:'wood'}],
  top:[
    {id:'t1', name:'Постформинг 38 мм, бетон', hex:'#A9A7A1', pattern:'plain', t:38, price:3200, joint:2500, cut:800},
    {id:'t2', name:'Постформинг 38 мм, дуб', hex:'#B48A5A', pattern:'wood', t:38, price:3200, joint:2500, cut:800},
    {id:'t3', name:'Компакт-плита 12 мм, графит', hex:'#383735', pattern:'plain', t:12, price:9000, joint:3500, cut:2500},
    {id:'t4', name:'Кварц 20 мм, белый мрамор', hex:'#ECEBE6', pattern:'marble', t:20, price:28000, joint:9000, cut:6000}],
};
const DEFAULT_PRICES = {
  hdf:250, edge2:40, edge04:12,
  blum:{hinge:750, legrabox:9500, tandembox:6800, aventos:12500, tipon:1200, cargo:16000, fridgeMount:900},
  leg:70, hanger:90, shelfPin:10, fixings:200, dwMount:400, bar:350, gola:1800, glass:4500,
  led:2400, ledDriver:3800, cutPipe:300,
  plinth:450, splash:2500,
  work:{cut:150, edging:35, assembly:700},
  waste:{ldsp:1.2, hdf:1.15, edge:1.1},
  markup:100, install:10, delivery:3000,
};

function catFind(list, id){ return list.find(r => r.id === id) || list[0]; }
function wallsOf(S){ return S.layout === 'U' ? ['A','B','C'] : S.layout === 'L' ? ['A','B'] : ['A']; }
function activeModules(S){ const w = wallsOf(S); return S.modules.filter(m => w.includes(m.wall)); }
function facadeColorId(m, S){ return m.facade || (TYPES[m.type].row === 'low' ? S.mat.fLow : S.mat.fUp); }

function shelvesOf(m){
  const H = m.h;
  switch (m.type){
    case 'base_door': case 'base_corner': return [Math.round(H / 2)];
    case 'base_drawer_door': return [Math.round(H * .39)];
    case 'base_oven': return [H - 600];
    case 'upper_door': case 'upper_glass': case 'upper_corner': case 'upper_open':
      return H > 760 ? [Math.round(H / 3), Math.round(H * 2 / 3)] : [Math.round(H / 2)];
    case 'mezz_door': return H > 450 ? [Math.round(H / 2)] : [];
    case 'tall_door': return [1, 2, 3, 4].map(i => Math.round(H * i / 5));
    case 'tall_oven': return [520, 1115, 1495];
    case 'tall_fridge': return [1770];
    default: return [];
  }
}

function facadesOf(m, S){
  const t = TYPES[m.type], W = m.w, H = m.h, out = [];
  const door = (x, y, w, h, hinge, ex = {}) => out.push(Object.assign({x, y, w, h, k:'door', hinge}, ex));
  const cols = (y, h, ex = {}) => { const n = W > 500 ? 2 : 1, cw = W / n; for (let i = 0; i < n; i++) door(i*cw + 2, y, cw - 4, h, n === 1 ? 'left' : (i ? 'right' : 'left'), ex); };
  const drw = (y, h) => out.push({x:2, y, w:W - 4, h, k:'drawer'});
  switch (m.type){
    case 'base_door': case 'base_sink': case 'upper_door': case 'mezz_door': cols(2, H - 4); break;
    case 'upper_glass': cols(2, H - 4, {glass:true}); break;
    case 'base_drawer_door': { const dh = Math.round(H * .22); cols(2, H - dh - 4); drw(H - dh + 2, dh - 4); break; }
    case 'base_drawers2': { const a = Math.round(H / 2); drw(2, a - 4); drw(a + 2, H - a - 4); break; }
    case 'base_drawers3': { const a = Math.round(H * .39), b = Math.round(H * .39); drw(2, a - 4); drw(a + 2, b - 4); drw(a + b + 2, H - a - b - 4); break; }
    case 'base_oven': drw(2, Math.max(H - 600, 60) - 4); break;
    case 'base_dw': out.push({x:2, y:2, w:W - 4, h:H - 4, k:'dw'}); break;
    case 'base_cargo': out.push({x:2, y:2, w:W - 4, h:H - 4, k:'cargo'}); break;
    case 'base_corner': case 'upper_corner': {
      const blind = m.type === 'base_corner' ? 600 : 320, dw = Math.max(W - blind, 250);
      if (m.blind === 'right') door(2, 2, dw - 4, H - 4, 'left'); else door(W - dw + 2, 2, dw - 4, H - 4, 'right');
      break; }
    case 'upper_lift': case 'mezz_lift': out.push({x:2, y:2, w:W - 4, h:H - 4, k:'lift'}); break;
    case 'tall_door': {
      const n = W > 500 ? 2 : 1, cw = W / n, hb = Math.round(H * .62);
      for (let i = 0; i < n; i++){ const hg = n === 1 ? 'left' : (i ? 'right' : 'left');
        door(i*cw + 2, 2, cw - 4, hb - 4, hg, {part:'bottom'}); door(i*cw + 2, hb + 2, cw - 4, H - hb - 4, hg, {part:'top'}); }
      break; }
    case 'tall_oven': { drw(2, 256); drw(262, 254); const y0 = 520 + 595 + 380; cols(y0 + 2, H - y0 - 4, {part:'top'}); break; }
    case 'tall_fridge': {
      out.push({x:2, y:2, w:W - 4, h:716, k:'fridge', hinge:'right', part:'bottom'}, {x:2, y:722, w:W - 4, h:1046, k:'fridge', hinge:'right', part:'bottom'});
      cols(1772, H - 1774, {part:'top'}); break; }
  }
  if (S.mat.handle === 'gola'){
    if (t.row === 'low' && !t.tall) out.forEach(f => { f.h -= GOLA; f.channel = true; });
    else if (t.tall) out.forEach(f => {
      if (f.k === 'drawer'){ f.h -= GOLA; f.channel = true; return; }
      if (f.hinge === 'left'){ f.w -= GOLA; f.vch = f.x + f.w + 2; } else { f.x += GOLA; f.w -= GOLA; f.vch = f.x - GOLA - 2; }
    });
    else out.forEach(f => { f.y -= 20; f.h += 20; });
  }
  return out;
}

function panelsOf(m, S){
  const t = TYPES[m.type], p = [];
  if (t.gap || m.type === 'base_dw') return p;
  const W = m.w, H = m.h, D = m.d, wi = W - 2*T;
  const add = (n, a, b, q, mat, e2) => { if (q > 0) p.push({n, a:Math.round(a), b:Math.round(b), q, mat, e2:e2 || 0}); };
  add('Боковина', H, D, 2, 'ldsp', H);
  if (t.row === 'low' && !t.tall){ add('Дно', wi, D, 1, 'ldsp', wi); add('Царга', wi, 100, 2, 'ldsp', wi); }
  else add('Дно и крыша', wi, D, 2, 'ldsp', wi);
  add('Полка', wi - 2, D - 20, shelvesOf(m).length, 'ldsp', wi - 2);
  const nd = facadesOf(m, S).filter(f => f.k === 'drawer').length;
  add('Дно ящика', wi - 26, D - 70, nd, 'ldsp', 0);
  if (S.mat.drawers === 'tandembox') add('Задняя стенка ящика', wi - 38, 120, nd, 'ldsp', 0);
  if (m.type !== 'base_sink') add('Задняя стенка', W - 2, H - 2, 1, 'hdf');
  return p;
}

function hwOf(m, facs, S){
  const t = TYPES[m.type];
  const h = {hinge:0, slide:0, lift:0, cargo:0, fridge:0, dw:0, bar:0, push:0, gola:0, leg:0, hanger:0, pin:0, fix:0, glass:0};
  facs.forEach(f => {
    if (f.k === 'door') h.hinge += f.h <= 900 ? 2 : f.h <= 1600 ? 3 : 4;
    if (f.k === 'drawer') h.slide++;
    if (f.k === 'lift') h.lift++;
    if (f.k === 'cargo') h.cargo++;
    if (f.k === 'fridge') h.fridge++;
    if (f.k === 'dw') h.dw++;
    if (f.glass) h.glass += Math.max(0, f.w - 120) * Math.max(0, f.h - 120) / 1e6;
    if (S.mat.handle === 'bar') h.bar++;
    if (S.mat.handle === 'push' && f.k !== 'dw' && f.k !== 'fridge') h.push++;
    if (f.channel) h.gola += (f.w + 4) / 1000;
    if (f.vch !== undefined) h.gola += (f.h + 4) / 1000;
  });
  if (!t.gap && m.type !== 'base_dw'){
    h.fix = 1;
    if (t.row === 'low') h.leg = m.w >= 800 ? 6 : 4; else h.hanger = 2;
  }
  h.pin = shelvesOf(m).length * 4;
  return h;
}

function calcModule(m, S, P, C){
  const facs = facadesOf(m, S), panels = panelsOf(m, S), hw = hwOf(m, facs, S), t = TYPES[m.type];
  let ldsp = 0, hdf = 0, e2 = 0, e04 = 0;
  panels.forEach(p => { const a = p.a * p.b / 1e6 * p.q;
    if (p.mat === 'ldsp'){ ldsp += a; e2 += p.e2 * p.q / 1000; e04 += (2*(p.a + p.b) - p.e2) * p.q / 1000; } else hdf += a; });
  const facArea = facs.reduce((s, f) => s + f.w * f.h / 1e6, 0);
  const decor = catFind(C.corpus, m.corpus || S.mat.corpus);
  const fm = catFind(C.facade, S.mat.facade), ml = catFind(C.milling, S.mat.milling);
  const Wt = P.waste, B = P.blum;
  const corpus = ldsp*Wt.ldsp*decor.price + hdf*Wt.hdf*P.hdf + (e2*P.edge2 + e04*P.edge04)*Wt.edge;
  const facade = facArea * (fm.price + ml.add) + hw.glass * P.glass;
  const light = m.light && t.row === 'up' && !t.gap ? m.w / 1000 * P.led : 0;
  const hwc = hw.hinge*B.hinge + hw.slide*B[S.mat.drawers] + hw.lift*B.aventos + hw.cargo*B.cargo + hw.fridge*B.fridgeMount
    + hw.dw*P.dwMount + hw.bar*P.bar + hw.push*B.tipon + hw.gola*P.gola + hw.leg*P.leg + hw.hanger*P.hanger
    + hw.pin*P.shelfPin + hw.fix*P.fixings + light;
  const work = ldsp*P.work.cut + (e2 + e04)*P.work.edging + (hw.fix ? P.work.assembly : 0) + (m.cut && m.cut.pipe ? P.cutPipe : 0);
  const cost = corpus + facade + hwc + work;

function layoutOf(S){

    let u = offU;
    by('up').forEach(m => {
      let moved = true;
      while (moved){ moved = false; for (const [a, b] of tallI) if (u < b && u + m.w > a){ u = b; moved = true; } }
      res.pos[m.id] = {x:u, wall:wl}; u += m.w; });
    let z = offU;
    by('mezz').forEach(m => { res.pos[m.id] = {x:z, wall:wl}; z += m.w; });
    const upEnd = Math.max(u, offU, ...tallI.map(i => i[1]));
    res.walls[wl] = {L, lowEnd:x, upEnd, mezzEnd:z, nLow:by('low').length, nUp:by('up').length, nMezz:by('mezz').length, offL, offU, lows:by('low'), ups:by('up')};
    let seg = null;

      if (!seg) seg = {wall:wl, x0:p.x, x1:p.x + m.w, h:m.h}; else { seg.x1 = p.x + m.w; seg.h = Math.max(seg.h, m.h); }
    });
    if (seg) res.tops.push(seg);
    const nm = {A:'А', B:'Б', C:'В'}[wl];
    if (x > L) res.warnings.push(`Стена ${nm}: нижний ряд длиннее стены на ${x - L} мм`);
    if (upEnd > L) res.warnings.push(`Стена ${nm}: верхний ряд длиннее стены на ${upEnd - L} мм`);

    if (res.walls.B.nUp && A.ups[0] && !(A.ups[0].type === 'upper_corner' && A.ups[0].blind !== 'right')) res.warnings.push('Угол со стеной Б: первым вверху на стене А поставьте «Угловой верхний» с глухой частью слева');
  }
  if (ws.includes('C')){
    const ll = A.lows[A.lows.length - 1], lu = A.ups[A.ups.length - 1];

    if (res.walls.C.nUp && lu && !(lu.type === 'upper_corner' && lu.blind === 'right')) res.warnings.push('Угол со стеной В: последним вверху на стене А поставьте «Угловой верхний» с глухой частью справа');
  }

  if (hiMezz.length) res.warnings.push(`Антресоли выше потолка ${S.room.height} мм: уменьшите высоту антресолей`);
  return res;
}

  // TODO(технолог): подтвердить правила — скидка и монтаж по этим строкам, строки «без скидки» (техника).
  const extras = (S.extra || []).filter(x => x.name || +x.price).map(x => {

  });

}

  return `<div class="swatches">${extra}${list.map(c => `<button class="sw" data-act="${act}" data-k="${key}" data-v="${esc(c.id ?? c.hex)}" aria-pressed="${(c.id ?? c.hex) === cur}" aria-label="${esc(c.name)}" title="${esc(c.name)}" style="background:${swBg(c)}"></button>`).join('')}</div>`;
}
function renderLeft(){
  ['room','catalog','module','mat'].forEach(t => $('lt-' + t).setAttribute('aria-selected', String(S.ltab === t)));
  const f = {room:leftRoom, catalog:leftCatalog, module:leftModule, mat:leftMat}[S.ltab] || leftCatalog;
  keepFocus(() => { $('lbody').innerHTML = f(); });
}
function fillHtml(){
  let h = '';
  wallsOf(S).forEach(wl => {
    const w = A.R.walls[wl];
    [['низ', w.lowEnd, w.nLow], ['верх', w.upEnd, w.nUp], ['антресоли', w.mezzEnd, w.nMezz]].forEach(([nm, used, n]) => {
      if (nm === 'антресоли' && !n) return;
      const over = used > w.L, pct = Math.min(100, used / w.L * 100);
      h += `<div class="fillrow"><span class="t">${WN[wl]} · ${nm}</span><div class="bar ${over ? 'over' : ''}"><i style="width:${pct}%"></i></div>
        <div class="fillnote ${over ? 'over' : ''}">${used} из ${w.L} мм · ${over ? 'не помещается +' + (used - w.L) : 'свободно ' + (w.L - used)}</div></div>`;
    });
  });
  A.R.warnings.forEach(x => h += `<div class="warn">${esc(x)}</div>`);
  const hidden = S.modules.filter(m => !wallsOf(S).includes(m.wall)).length;
  if (hidden) h += `<div class="small muted">Скрыто модулей на неиспользуемых стенах: ${hidden}. В смету они не входят.</div>`;
  return h;
}

function typeOptions(sel){

    <table class="mini" aria-label="Состав цены">
      <tr><td>Корпус, ${esc(r.decor.name.toLowerCase())}</td><td></td><td>${rub(r.c.corpus)}</td></tr>

    </table></div>`;
  return h;
}

function renderSmeta(){

function parseNum(s){ const v = parseFloat(String(s ?? '').replace(/[\s ₽]/g, '').replace(',', '.')); return isFinite(v) ? v : NaN; }
function pasteRows(key, text){
  const sp = CAT_SPEC[key], out = [];
  text.split(/\r?\n/).forEach((line, li) => {
    if (!line.trim()) return;
    const cells = line.includes('\t') ? line.split('\t') : line.split(';');
    const row = {id:key[0] + Date.now().toString(36) + li + Math.random().toString(36).slice(2, 5)};
    sp.cols.forEach(([c, , type]) => { row[c] = type === 'num' ? 0 : type === 'color' ? '#CCCCCC' : type === 'text' ? '' : type.slice(4).split(',')[0].split('=')[0]; });
    sp.paste.forEach((c, i) => {
      const v = (cells[i] || '').trim(); if (!v) return;
      const type = sp.cols.find(x => x[0] === c)[2];
      if (type === 'num'){ const n = parseNum(v); if (isFinite(n)) row[c] = n; }
      else if (type === 'color'){ if (/^#?[0-9a-f]{6}$/i.test(v)) row[c] = v[0] === '#' ? v : '#' + v; }
      else row[c] = v;
    });
    if (key === 'top' && !row.t) row.t = 38;
    if (row.name && !(li === 0 && /назв|name/i.test(row.name))) out.push(row);
  });
  return out;
}

function snapshot3D(){
  if (!has3D || !root) return '';
  const hid = [];
  try {
    root.traverse(o => { if (o.isSprite && o.visible){ o.visible = false; hid.push(o); } });
    const hv = helper ? helper.visible : true; if (helper) helper.visible = false;
    if (ghost) ghost.visible = false;
    renderer.render(scene, camera);
    const src = renderer.domElement, c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
    const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, c.height); gr.addColorStop(0, '#F8F6F2'); gr.addColorStop(1, '#E2DED5');
    g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height); g.drawImage(src, 0, 0);
    hid.forEach(o => o.visible = true); if (helper) helper.visible = hv; if (ghost) ghost.visible = true;
    return c.toDataURL('image/jpeg', .9);
  } catch(e){ hid.forEach(o => o.visible = true); return ''; }
}

/* ---------------- расстановка: перетаскивание из каталога, «нажми и поставь», перенос выбранного шкафа ---------------- */
function rayAt(cx, cy){
  const rect = renderer.domElement.getBoundingClientRect();
  const rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2((cx - rect.left) / rect.width * 2 - 1, -(cy - rect.top) / rect.height * 2 + 1), camera); return rc;
}
function pickModId(cx, cy){
  if (!root) return null;
  for (const h of rayAt(cx, cy).intersectObjects(root.children, true)){ let o = h.object; while (o && !o.userData.modId) o = o.parent; if (o) return o.userData.modId; }
  return null;
}
function overStage(e){ const r = $('stage').getBoundingClientRect(); return has3D && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; }
// стена и позиция вдоль неё под курсором: луч пересекается с плоскостью на половине глубины модуля
function dropTarget(cx, cy, type, m){
  const t = TYPES[type], D = (t.gap ? (t.row === 'low' ? 600 : 300) : (m ? m.d : t.d)) / 1000, ray = rayAt(cx, cy).ray; let best = null;
  wallsOf(S).forEach(wl => {
    const n = wl === 'A' ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(1, 0, 0), c = wl === 'C' ? S.walls.A / 1000 - D / 2 : D / 2;
    const den = ray.direction.dot(n); if (Math.abs(den) < 1e-6) return;

    const pt = ray.origin.clone().addScaledVector(ray.direction, tt), u = (wl === 'A' ? pt.x : pt.z) * 1000;
    if (u < -300 || u > S.walls[wl] + 300 || pt.y < -.05 || pt.y > S.room.height / 1000 + .3) return;
    if (!best || tt < best.t) best = {wall:wl, u, t:tt};
  });
  return best;
}
function slotFor(type, wall, u, ignoreId){
  const row = TYPES[type].row, W = A.R.walls[wall];

  let ref = null;
  for (const m of list){ const p = A.R.pos[m.id]; if (p && p.x + m.w / 2 > u){ ref = m; break; } }

function hideGhost(){ if (ghost){ scene.remove(ghost); ghost.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); ghost = null; } }
function showGhost(type, wall, x, m){

  const geo = new THREE.BoxGeometry(d.W / 1000, d.H / 1000, d.D / 1000), pos = new THREE.Vector3(d.W / 2000, (d.y0 + d.H / 2) / 1000, d.D / 2000);

  const ed = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({color:c})); ed.position.copy(pos); ed.renderOrder = 6;

  const {wall, u} = dropAt, slot = slotFor(type, wall, u, moveId); let nm;
  if (moveId){ nm = S.modules.find(o => o.id === moveId); S.modules = S.modules.filter(o => o !== nm); if (nm.wall !== wall){ nm.wall = wall; nm.blind = wall === 'B' ? 'right' : 'left'; } }

  if (slot.ref) S.modules.splice(S.modules.indexOf(slot.ref), 0, nm);

}
function updateBanner(){ $('placeBanner').hidden = !placing; $('placeText').textContent = placing ? 'Нажмите на стену, куда поставить: ' + TYPES[placing.type].name : ''; }

}

  if (dragging){ const c = document.querySelector('.dragchip'); if (c) c.remove(); dragging = null; document.body.style.userSelect = ''; }
  if (mv){ mv = null; if (controls) controls.enabled = true; }
  pend = null; dropAt = null; hideGhost();
}
function beginCatalogDrag(){
  if (!pend || pend.started) return; pend.started = true; dragging = {type:pend.type};
  if (placing) stopPlacing(); if (S.drawer && window.innerWidth > 1080) setDrawer(false);

document.addEventListener('pointerdown', e => {

document.addEventListener('pointercancel', cancelDrags);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (placing || dragging || mv)){ cancelDrags(); stopPlacing(); } });

ensureRefs(); recalc();
renderPrices(); setTab(S.tab || 'smeta'); setDrawer(!!S.drawer); renderExtras();

mq.addEventListener ? mq.addEventListener('change', onTheme) : mq.addListener(onTheme);
