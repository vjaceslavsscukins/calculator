# Локальный запуск портала: PostgreSQL 16 + сервер с интерфейсом.
# cp .env.example .env  →  заполнить  →  docker compose up --build  →  http://localhost:8787
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kp
      POSTGRES_USER: kp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kp -d kp"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://kp:${POSTGRES_PASSWORD}@db:5432/kp
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_SSL: ${DATABASE_SSL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-}
      RENDER_PROVIDER: ${RENDER_PROVIDER:-openai-compatible}
      RENDER_API_URL: ${RENDER_API_URL:-}
      RENDER_API_KEY: ${RENDER_API_KEY:-}
      RENDER_MODEL: ${RENDER_MODEL:-}
      AI_TEXT_API_URL: ${AI_TEXT_API_URL:-}
      AI_TEXT_API_KEY: ${AI_TEXT_API_KEY:-}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      PORT: 8787
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
