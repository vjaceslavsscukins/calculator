# Render Blueprint: временный хостинг прототипа конструктора кухонь.
# Прототип — одна статическая страница, сборка не нужна.
# Когда проект переедет на Timeweb, этот файл можно удалить.
services:
  - type: web
    name: kitchen-prototype
    runtime: static
    staticPublishPath: ./prototype
    routes:
      - type: rewrite
        source: /
        destination: /kitchen.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
