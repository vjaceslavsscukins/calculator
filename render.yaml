# Render Blueprint: временный хостинг прототипа конструктора кухонь.
# Прототип — одна статическая страница, сборка не нужна.
# Когда проект переедет на Timeweb, этот файл можно удалить.
services:
  - type: web
    name: kitchen-prototype
    runtime: static
    staticPublishPath: ./prototype
    routes:
      - type: rewrite
        source: /
        destination: /kitchen.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # Сервер «только чтение» между нами и Битрикс24: ключ вебхука хранится только здесь.
  # RELAY_TOKEN Render сгенерирует сам (Dashboard → kitchen-api → Environment), BITRIX24_WEBHOOK_URL введите при создании.
  - type: web
    name: kitchen-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install
    startCommand: node src/server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BITRIX24_WEBHOOK_URL
        sync: false
      - key: RELAY_TOKEN
        generateValue: true
